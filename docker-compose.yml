services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dnscope
    ports:
      - "5432:5432"
    volumes:
      - dnscope_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dnscope"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dnscope_pgdata:

