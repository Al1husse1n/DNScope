services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dnscope
    volumes:
      - dnscope_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dnscope"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/dnscope
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      VT_API_KEY: ${VT_API_KEY:-}
      API_KEY_HMAC_SECRET: ${API_KEY_HMAC_SECRET:-dev-only-change-me}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      PUBLIC_RATE_LIMIT_PER_HOUR: "10"
      PUBLIC_LLM_DAILY_CAP: "500"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic -c src/dnscope/db/alembic.ini upgrade head &&
             uvicorn dnscope.api.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dnscope_pgdata:

