[project]
name = "dnscope"
version = "0.1.0"
description = "Multi-agent domain threat-investigation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "dnspython>=2.6",
    "fastapi>=0.115",
    "google-genai>=1.0",
    "httpx>=0.27",
    "idna>=3",
    "langgraph>=0.2",
    "pydantic>=2",
    "pydantic-settings",
    "python-dotenv",
    "python-json-logger>=3.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-httpx",
    "ruff",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-httpx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["UP045", "BLE001"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p tests.conftest_db -p tests.conftest_auth"
markers = [
    "live: tests that hit the real network; skipped by default",
    "gemini_live: tests that hit the real Gemini API; skipped unless GEMINI_API_KEY is set",
]
